# Example only. Not a Helm chart, not an Operator.
# One daemon per remaining node (not the seed's node). Join them as voters
# until you have 3, then `join --observer` on extra nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: clusdr
  namespace: clusdr
  labels:
    app.kubernetes.io/name: clusdr
    app.kubernetes.io/component: member
    app.kubernetes.io/part-of: clusdr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clusdr
      app.kubernetes.io/component: member
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clusdr
        app.kubernetes.io/component: member
        app.kubernetes.io/part-of: clusdr
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: clusdr
                  app.kubernetes.io/component: seed
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: clusdr
          image: durguto/clusdr:0.2.1
          imagePullPolicy: IfNotPresent
          args: ["start"]
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CLUSDR_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSDR_DATA_DIR
              value: /var/lib/clusdr
            - name: CLUSDR_CONTROL_SOCKET
              value: /var/lib/clusdr/clusdr.sock
            - name: CLUSDR_GRPC_ADDR
              value: 0.0.0.0:7947
            - name: CLUSDR_NODE_ADDR
              value: "$(NODE_IP):7947"
            - name: CLUSDR_RAFT_ADDR
              value: "$(NODE_IP):7946"
            - name: CLUSDR_LOG_FORMAT
              value: json
            - name: CLUSDR_LOG_LEVEL
              value: info
          volumeMounts:
            - name: data
              mountPath: /var/lib/clusdr
          ports:
            - name: grpc
              containerPort: 7947
              protocol: TCP
            - name: raft
              containerPort: 7946
              protocol: TCP
          # Runtime Health RPC (not clusdr status). Needs a binary that has
          # `clusdr health`. Else tcpSocket 7947.
          livenessProbe:
            exec:
              command: ["/clusdr", "health"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["/clusdr", "health"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /var/lib/clusdr
            type: DirectoryOrCreate
