# Not a clusdr member. Not a Service of clusdr.
# Sidecar topology: skip this — Local() on 127.0.0.1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          image: your.registry/app:tag
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CLUSDR_GRPC_ADDR
              value: "$(NODE_IP):7947"
            - name: CLUSDR_DATA_DIR
              value: /var/lib/clusdr
            # Dev without PEMs: CLUSDR_TLS=disabled on daemon and app.
            # - name: CLUSDR_TLS
            #   value: disabled
          volumeMounts:
            - name: clusdr-data
              mountPath: /var/lib/clusdr
              readOnly: true
      volumes:
        - name: clusdr-data
          hostPath:
            path: /var/lib/clusdr
            type: Directory
