# Example only. Not a clusdr member. Not a Service of clusdr.
#
# Your application on the node. Local() / local() dials CLUSDR_GRPC_ADDR.
# With the DaemonSet/seed hostNetwork example, 127.0.0.1 inside this pod is
# not the daemon — use the node IP (Downward API).
#
# Replace spec.template.spec.containers[0].image with your app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          image: your.registry/app:tag
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: CLUSDR_GRPC_ADDR
              value: "$(NODE_IP):7947"
            # Mount the node's data.dir and set CLUSDR_DATA_DIR,
            # or set CLUSDR_TLS=disabled on daemon and app (dev only).
            # - name: CLUSDR_DATA_DIR
            #   value: /var/lib/clusdr
          # volumeMounts:
          #   - name: clusdr-data
          #     mountPath: /var/lib/clusdr
          #     readOnly: true
      # volumes:
      #   - name: clusdr-data
      #     hostPath:
      #       path: /var/lib/clusdr
      #       type: Directory
