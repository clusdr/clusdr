# clusdr-operator RBAC. Reconciles ClusdrCluster (DaemonSet or Sidecar STS).
# Does not embed Raft. Does not replace coordination.k8s.io.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusdr-operator
  namespace: clusdr
  labels:
    app.kubernetes.io/name: clusdr-operator
    app.kubernetes.io/part-of: clusdr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clusdr-operator
  labels:
    app.kubernetes.io/name: clusdr-operator
    app.kubernetes.io/part-of: clusdr
rules:
  - apiGroups: ["clusdr.io"]
    resources: ["clusdrclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clusdr.io"]
    resources: ["clusdrclusters/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clusdr-operator
  labels:
    app.kubernetes.io/name: clusdr-operator
    app.kubernetes.io/part-of: clusdr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clusdr-operator
subjects:
  - kind: ServiceAccount
    name: clusdr-operator
    namespace: clusdr
