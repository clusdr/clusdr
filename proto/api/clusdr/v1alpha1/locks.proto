syntax = "proto3";

package clusdr.v1alpha1;

option go_package = "github.com/clusdr/clusdr/api/clusdr/v1alpha1;clusdrv1alpha1";

// LockService provides cluster-wide exclusive locks backed by Raft.
//
// Acquire, renew, and release are committed on the leader; followers forward.
// A lock expires when its deadline passes unless Renew is called in time.
service LockService {
  // Lock blocks until the named lock is acquired or the RPC deadline expires.
  rpc Lock(LockRequest) returns (LockResponse);
  // TryLock attempts once and returns immediately.
  rpc TryLock(TryLockRequest) returns (TryLockResponse);
  // Unlock releases a lock. holder + fencing_token must match the holder.
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  // Renew extends the deadline. holder + fencing_token must match.
  rpc Renew(LockServiceRenewRequest) returns (LockServiceRenewResponse);
  // ListLocks returns every currently held lock.
  rpc ListLocks(ListLocksRequest) returns (ListLocksResponse);
}

message LockRequest {
  // name is the lock identity (1–128 chars: letters, digits, . _ -).
  string name = 1;
  // holder is the node or client id taking the lock. Empty → this daemon's node id.
  string holder = 2;
  // ttl_ms is the grant lifetime. 0 uses the daemon default (lock.ttl).
  int64 ttl_ms = 3;
}

message LockResponse {
  bool acquired = 1;
  string message = 2;
  // fencing_token is a cluster-wide monotonic counter. Store it and pass it
  // to Unlock. A stale holder with an old token cannot release a new grant.
  uint64 fencing_token = 3;
  string holder = 4;
  int64 deadline_unix_ms = 5;
}

message TryLockRequest {
  // name is the lock identity (1–128 chars: letters, digits, . _ -).
  string name = 1;
  // holder is the node or client id taking the lock. Empty → this daemon's node id.
  string holder = 2;
  // ttl_ms is the grant lifetime. 0 uses the daemon default (lock.ttl).
  int64 ttl_ms = 3;
}

message TryLockResponse {
  bool acquired = 1;
  string message = 2;
  uint64 fencing_token = 3;
  string holder = 4;
  int64 deadline_unix_ms = 5;
}

message UnlockRequest {
  string name = 1;
  string holder = 2;
  uint64 fencing_token = 3;
}

message UnlockResponse {
  bool released = 1;
  string message = 2;
}

message LockServiceRenewRequest {
  string name = 1;
  string holder = 2;
  uint64 fencing_token = 3;
  // ttl_ms replaces the remaining lifetime. 0 reuses the original TTL.
  int64 ttl_ms = 4;
}

message LockServiceRenewResponse {
  bool renewed = 1;
  string message = 2;
  uint64 fencing_token = 3;
  int64 deadline_unix_ms = 4;
}

message ListLocksRequest {}

message LockInfo {
  string name = 1;
  string holder = 2;
  uint64 fencing_token = 3;
  int64 acquired_unix_ms = 4;
  int64 deadline_unix_ms = 5;
}

message ListLocksResponse {
  repeated LockInfo locks = 1;
}
