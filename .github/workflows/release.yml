name: Release

# vX.Y.Z-rc.N: lint, test, smoke, GitHub prerelease, versioned images/chart (not latest).
# vX.Y.Z: the same, plus latest.json, :latest images, Artifact Hub metadata, SDK tags.
# Language SDKs publish only on a stable tag (no hyphen) in their own repos.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish Hub and GHCR images (daemon + operator)
        required: true
        default: v0.2.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2
          working-directory: sdk
          args: --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        run: |
          go test -race -count=1 -p 1 ./...
          go test -C sdk -race -count=1 ./...

  smoke:
    name: Smoke
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build and smoke
        run: |
          make build VERSION=rc COMMIT=${{ github.sha }}
          chmod +x scripts/release-smoke.sh
          ./scripts/release-smoke.sh ./bin/clusdr

  goreleaser:
    name: GitHub Release
    needs: [lint, test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/clusdr_*_linux_*.tar.gz

      - name: Attach provenance to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Scorecard Signed-Releases looks for *.intoto.jsonl on release assets.
          # gh writes sha256:<digest>.jsonl in the current directory.
          for i in 1 2 3 4 5 6; do
            if gh attestation download dist/checksums.txt -R "${GITHUB_REPOSITORY}" -L 1; then
              break
            fi
            sleep 5
          done
          sha=$(sha256sum dist/checksums.txt | awk '{print $1}')
          jsonl="sha256:${sha}.jsonl"
          test -f "$jsonl"
          mv "$jsonl" dist/checksums.txt.intoto.jsonl
          gh release upload "$tag" dist/checksums.txt.intoto.jsonl --clobber

      - name: Upload latest.json
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          cat > latest.json <<EOF
          {
            "tag": "${tag}",
            "version": "${ver}",
            "checksums": "checksums.txt",
            "archives": {
              "linux_amd64": "clusdr_${ver}_linux_amd64.tar.gz",
              "linux_arm64": "clusdr_${ver}_linux_arm64.tar.gz"
            }
          }
          EOF
          gh release upload "$tag" latest.json --clobber

  chart:
    name: Helm chart
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          chmod +x scripts/package-chart.sh
          tgz=$(./scripts/package-chart.sh "$ver" dist)
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(helm push "$tgz" oci://ghcr.io/clusdr/charts 2>&1 | tee /dev/stderr | awk '/^Digest:/{print $2}')
          test -n "$digest"
          # Cosign v3 default: OCI referrers + Sigstore bundle. Artifact Hub reads both.
          cosign sign --yes "ghcr.io/clusdr/charts/clusdr@${digest}"
          cosign sign-blob --yes --bundle "${tgz}.sigstore.json" "$tgz"
          gh release upload "$tag" "$tgz" "${tgz}.sigstore.json" --clobber --repo clusdr/clusdr

      - uses: oras-project/setup-oras@5c0b487ce3fe0ce3ab0d034e63669e426e294e4d # v1.2.2

      - name: Artifact Hub repo metadata
        if: ${{ !contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push \
            ghcr.io/clusdr/charts/clusdr:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/clusdr/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  manifests:
    name: Operator YAML
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Package YAML
        id: yaml
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          chmod +x scripts/package-operator-yaml.sh
          mkdir -p dist
          ./scripts/package-operator-yaml.sh "$ver" dist
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.yaml.outputs.tag }}"
          ver="${{ steps.yaml.outputs.ver }}"
          gh release upload "$tag" \
            "dist/clusdr-crds.yaml" \
            "dist/clusdr-crds-${ver}.yaml" \
            "dist/clusdr-operator.yaml" \
            "dist/clusdr-operator-${ver}.yaml" \
            "dist/clusdr-operator-bundle.yaml" \
            "dist/clusdr-operator-bundle-${ver}.yaml" \
            --clobber --repo clusdr/clusdr

  docker:
    name: Images
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Image version
        id: ver
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "daemon<<EOF"
            echo "durguto/clusdr:${tag}"
            echo "ghcr.io/clusdr/clusdr:${tag}"
            if [[ "$tag" != *-* ]]; then
              echo "durguto/clusdr:latest"
              echo "ghcr.io/clusdr/clusdr:latest"
            fi
            echo "EOF"
            echo "operator<<EOF"
            echo "durguto/clusdr-operator:${tag}"
            echo "durguto/clusdr-operator:${ver}"
            echo "ghcr.io/clusdr/clusdr-operator:${tag}"
            echo "ghcr.io/clusdr/clusdr-operator:${ver}"
            if [[ "$tag" != *-* ]]; then
              echo "durguto/clusdr-operator:latest"
              echo "ghcr.io/clusdr/clusdr-operator:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.daemon }}
          labels: |
            org.opencontainers.image.source=https://github.com/clusdr/clusdr
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.operator }}
          labels: |
            org.opencontainers.image.source=https://github.com/clusdr/clusdr
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          sign_list() {
            while IFS= read -r img; do
              [ -n "$img" ] || continue
              cosign sign --yes "$img"
            done
          }
          sign_list <<EOF
          ${{ steps.ver.outputs.daemon }}
          EOF
          sign_list <<EOF
          ${{ steps.ver.outputs.operator }}
          EOF

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Docker Hub overview
        if: ${{ !contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .dockerhub/push.py
