name: Release

# vX.Y.Z-rc.N: lint, test, smoke, GitHub prerelease, versioned images/chart (not latest).
# vX.Y.Z: the same, plus latest.json, :latest images, Artifact Hub metadata, SDK tags.
# Language SDKs publish only on a stable tag (no hyphen) in their own repos.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish Hub and GHCR images (daemon + operator)
        required: true
        default: v0.2.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: sdk
          args: --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        run: |
          go test -race -count=1 -p 1 ./...
          go test -C sdk -race -count=1 ./...

  smoke:
    name: Smoke
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build and smoke
        run: |
          make build VERSION=rc COMMIT=${{ github.sha }}
          chmod +x scripts/release-smoke.sh
          ./scripts/release-smoke.sh ./bin/clusdr

  goreleaser:
    name: GitHub Release
    needs: [lint, test, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          cat > latest.json <<EOF
          {
            "tag": "${tag}",
            "version": "${ver}",
            "checksums": "checksums.txt",
            "archives": {
              "linux_amd64": "clusdr_${ver}_linux_amd64.tar.gz",
              "linux_arm64": "clusdr_${ver}_linux_arm64.tar.gz"
            }
          }
          EOF
          gh release upload "$tag" latest.json --clobber

  chart:
    name: Helm chart
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          chmod +x scripts/package-chart.sh
          tgz=$(./scripts/package-chart.sh "$ver" dist)
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "$tgz" oci://ghcr.io/clusdr/charts
          gh release upload "$tag" "$tgz" --clobber --repo clusdr/clusdr

      - uses: oras-project/setup-oras@v1

      - name: Artifact Hub repo metadata
        if: ${{ !contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push \
            ghcr.io/clusdr/charts/clusdr:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/clusdr/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  manifests:
    name: Operator YAML
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Package YAML
        id: yaml
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          chmod +x scripts/package-operator-yaml.sh
          mkdir -p dist
          ./scripts/package-operator-yaml.sh "$ver" dist
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.yaml.outputs.tag }}"
          ver="${{ steps.yaml.outputs.ver }}"
          gh release upload "$tag" \
            "dist/clusdr-crds.yaml" \
            "dist/clusdr-crds-${ver}.yaml" \
            "dist/clusdr-operator.yaml" \
            "dist/clusdr-operator-${ver}.yaml" \
            --clobber --repo clusdr/clusdr

  docker:
    name: Images
    needs: [lint, test, smoke, goreleaser]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success' &&
      (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Image version
        id: ver
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "daemon<<EOF"
            echo "durguto/clusdr:${tag}"
            echo "ghcr.io/clusdr/clusdr:${tag}"
            if [[ "$tag" != *-* ]]; then
              echo "durguto/clusdr:latest"
              echo "ghcr.io/clusdr/clusdr:latest"
            fi
            echo "EOF"
            echo "operator<<EOF"
            echo "durguto/clusdr-operator:${tag}"
            echo "durguto/clusdr-operator:${ver}"
            echo "ghcr.io/clusdr/clusdr-operator:${tag}"
            echo "ghcr.io/clusdr/clusdr-operator:${ver}"
            if [[ "$tag" != *-* ]]; then
              echo "durguto/clusdr-operator:latest"
              echo "ghcr.io/clusdr/clusdr-operator:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.daemon }}
          labels: |
            org.opencontainers.image.source=https://github.com/clusdr/clusdr
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ver.outputs.operator }}
          labels: |
            org.opencontainers.image.source=https://github.com/clusdr/clusdr
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Docker Hub overview
        if: ${{ !contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, '-') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .dockerhub/push.py
