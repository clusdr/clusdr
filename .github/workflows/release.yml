name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish Hub and GHCR images for
        required: true
        default: v0.1.2

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: golangci-lint
        run: make lint

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          cat > latest.json <<EOF
          {
            "tag": "${tag}",
            "version": "${ver}",
            "checksums": "checksums.txt",
            "archives": {
              "linux_amd64": "clusdr_${ver}_linux_amd64.tar.gz",
              "linux_arm64": "clusdr_${ver}_linux_arm64.tar.gz"
            }
          }
          EOF
          gh release upload "$tag" latest.json --clobber

  docker:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Image version
        id: ver
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            durguto/clusdr:${{ steps.ver.outputs.tag }}
            durguto/clusdr:latest
            ghcr.io/durguto/clusdr:${{ steps.ver.outputs.tag }}
            ghcr.io/durguto/clusdr:latest
          labels: |
            org.opencontainers.image.source=https://github.com/durguto/clusdr
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 .dockerhub/push.py
