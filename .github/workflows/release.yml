name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  goreleaser:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          cat > latest.json <<EOF
          {
            "tag": "${tag}",
            "version": "${ver}",
            "checksums": "checksums.txt",
            "archives": {
              "linux_amd64": "clusdr_${ver}_linux_amd64.tar.gz",
              "linux_arm64": "clusdr_${ver}_linux_arm64.tar.gz"
            }
          }
          EOF
          gh release upload "$tag" latest.json --clobber

  docker:
    name: Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping image"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.hub.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.hub.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - if: steps.hub.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.hub.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.hub.outputs.skip != 'true'
        name: Image version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - if: steps.hub.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            odurgut/clusdr:${{ github.ref_name }}
            odurgut/clusdr:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
