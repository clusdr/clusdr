name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: .github/path-filters.yml

  lint:
    name: Lint
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip
        if: needs.changes.outputs.go != 'true'
        run: echo "no Go paths; Lint reports success without golangci-lint"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: needs.changes.outputs.go == 'true'
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        if: needs.changes.outputs.go == 'true'
        with:
          version: v2.13.2

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        if: needs.changes.outputs.go == 'true'
        with:
          version: v2.13.2
          working-directory: sdk
          args: --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        if: needs.changes.outputs.go != 'true'
        run: echo "no Go paths; Test reports success without go test"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: needs.changes.outputs.go == 'true'
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        if: needs.changes.outputs.go == 'true'
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        if: needs.changes.outputs.go == 'true'
        run: |
          # One suite: race + coverprofile. A second Coverage job was a second
          # dice roll on Raft SLO/chaos tests (PR green, main red).
          pkgs=$(go list ./... | grep -Ev '/examples/|/cmd/clusdr-bench|/cmd/clusdr-soak')
          go test -race -count=1 -p 1 -coverprofile=coverage.out $pkgs
          go tool cover -func=coverage.out | tail -1
          go test -C sdk -race -count=1 -coverprofile=../sdk-coverage.out ./...
          go tool cover -func=sdk-coverage.out | tail -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.go == 'true'
        with:
          name: coverage
          path: |
            coverage.out
            sdk-coverage.out
          if-no-files-found: error

  build:
    name: Build
    needs: [changes, test, lint]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build binary
        run: |
          make build VERSION=ci COMMIT=${{ github.sha }}
          make build-operator VERSION=ci COMMIT=${{ github.sha }}
          make bench
          make soak

      - name: Verify binary runs
        run: |
          ./bin/clusdr version
          ./bin/clusdr-operator version
          chmod +x scripts/release-smoke.sh
          ./scripts/release-smoke.sh ./bin/clusdr

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  helm:
    name: Helm
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        if: needs.changes.outputs.helm != 'true'
        run: echo "no chart/CRD paths; Helm reports success without helm lint"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.helm == 'true'

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: needs.changes.outputs.helm == 'true'
        with:
          version: v3.16.4

      - name: helm lint and template
        if: needs.changes.outputs.helm == 'true'
        run: |
          make helm
          make manifests
