name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: golangci-lint
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        run: |
          go test -race -count=1 -p 2 ./...
          go test -C sdk -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build binary
        run: |
          make build VERSION=ci COMMIT=${{ github.sha }}
          make build-operator VERSION=ci COMMIT=${{ github.sha }}
          make bench

      - name: Verify binary runs
        run: |
          ./bin/clusdr version
          ./bin/clusdr-operator version

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint and template
        run: |
          make helm
          make manifests
