name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        run: |
          go test -race -count=1 -p 2 ./...
          go test -C sdk -race -count=1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build binary
        run: |
          make build VERSION=ci COMMIT=${{ github.sha }}
          make bench

      - name: Verify binary runs
        run: ./bin/clusdr version

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
