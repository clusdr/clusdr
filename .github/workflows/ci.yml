name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: sdk
          args: --config=${{ github.workspace }}/.golangci.yml

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -C sdk ./...

      - name: go test
        run: |
          # One suite: race + coverprofile. A second Coverage job was a second
          # dice roll on Raft SLO/chaos tests (PR green, main red).
          pkgs=$(go list ./... | grep -Ev '/examples/|/cmd/clusdr-bench')
          go test -race -count=1 -p 1 -coverprofile=coverage.out $pkgs
          go tool cover -func=coverage.out | tail -1
          go test -C sdk -race -count=1 -coverprofile=../sdk-coverage.out ./...
          go tool cover -func=sdk-coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            sdk-coverage.out
          if-no-files-found: error

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build binary
        run: |
          make build VERSION=ci COMMIT=${{ github.sha }}
          make build-operator VERSION=ci COMMIT=${{ github.sha }}
          make bench

      - name: Verify binary runs
        run: |
          ./bin/clusdr version
          ./bin/clusdr-operator version
          chmod +x scripts/release-smoke.sh
          ./scripts/release-smoke.sh ./bin/clusdr

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint and template
        run: |
          make helm
          make manifests
